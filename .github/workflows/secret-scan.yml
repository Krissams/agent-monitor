name: Secret scan
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          asset="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$asset" \
            --output "$RUNNER_TEMP/$asset"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/$asset" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all fetched Git history with redacted findings
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts=--all \
            --redact=100 \
            --ignore-gitleaks-allow \
            --max-decode-depth=5 \
            --max-archive-depth=2 \
            --no-banner
